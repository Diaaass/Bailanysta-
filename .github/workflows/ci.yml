name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PG_URL: postgresql://postgres:postgres@localhost:5432/bailanysta_test

jobs:
  verify:
    name: Types, lint, unit and integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same extension the app relies on, so integration tests exercise the
        # real vector column rather than a stubbed one.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bailanysta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bailanysta_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bailanysta_test
      AUTH_SECRET: ci-only-secret-not-used-outside-this-job

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Enable pgvector
        run: psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector'

      - name: Apply migrations
        run: npm run db:migrate

      # PageProps/RouteContext are global helpers Next generates into .next/types,
      # which is not committed - without this tsc cannot see them.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bailanysta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bailanysta_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bailanysta_test
      AUTH_SECRET: ci-only-secret-not-used-outside-this-job
      # Playwright drives a production build on a non-standard port, which
      # Auth.js does not trust unless told to.
      AUTH_TRUST_HOST: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Enable pgvector
        run: psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector'

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
